[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Symptomate"
version = "0.0.0"
authors = [
    { name = "Loknath Saha", email = "loknathsaha2004@gmail.com" }
]
dependencies = [
    "chainlit>=2.10.1",
    "huggingface-hub>=1.9.0",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langchain-text-splitters>=1.1.1",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
